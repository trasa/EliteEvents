# The EDDN subscription, declared. This replaces 20-ingestion.yaml: the FeedListener controller
# reconciles it into the ConfigMap, Service and per-shard Deployment that file used to spell out.
#
# 20-ingestion.yaml is retained as the rollback target but is no longer in kustomization.yaml.
# Never list both: two writers on the same Redis double-count every docking, silently.
apiVersion: elite.meancat.com/v1alpha1
kind: FeedListener
metadata:
  name: eddn
  labels:
    app.kubernetes.io/part-of: elite-events
spec:
  relayEndpoint: tcp://eddn.edcd.io:9500

  # A shard count, not a replica count. EDDN broadcasts every message to every subscriber, so
  # each consumer still receives and decompresses the entire firehose; raising this splits only
  # the handler work, and the controller guarantees the partition covers every message exactly
  # once. One consumer is not close to strained at EDDN volumes — leave this at 1 unless there is
  # a measurement saying otherwise.
  consumers: 1

  # The controller does not track image tags; this is the deployed version, the same way
  # kustomization.yaml records the web tier's. `./deploy-k8s <tag>` does NOT rewrite this — an
  # ingestion upgrade is an edit here followed by `kubectl apply -k k8s/`.
  image: registry.digitalocean.com/meancat/elite-ingestion:1.0.0-alpha.ga4d0b00b5c
  imagePullSecrets:
    # DOKS's registry integration names this secret after the registry itself.
    - name: meancat

  redis:
    connectionString: redis:6379,abortConnect=false
    # Mounted as a file rather than folded into the connection string: the password may contain
    # ',' or '=', either of which would corrupt the parse.
    authSecret:
      name: redis-auth
      key: password

  # The same threshold the consumer reconnects on, so status flips to Silent exactly when
  # automatic recovery starts rather than at some unrelated moment.
  reconnectAfterSilence: 2m

  # How long Redis may be *continuously* unreachable before a consumer's liveness probe fails and
  # k8s restarts it. Matches the CRD default; written out so the knob is visible from the resource
  # rather than only from the CRD, because the moment it is wanted is an incident.
  #
  # A wedged StackExchange.Redis client is not a retry — it holds sockets it never uses and never
  # replaces, and waiting does not fix it. That took the web tier down for hours on 2026-08-14
  # while every pod reported Running with zero restarts; a consumer fails even quieter, because it
  # serves nothing to 503 with and simply stops writing. Anything shorter than this is a consumer
  # that really is just retrying, and restarting those is the risk this trades against. Set to 0
  # to disable the watchdog.
  redisUnreachableRestartAfter: 15m

  # Search-index upkeep. index:systems and index:carriers cannot expire themselves, so they are
  # reconciled against the live 30-day data on a schedule. Omitting this block is the normal
  # case: the controller defaults it to an hourly CronJob running the ingestion image, and
  # switches the consumers' own in-process timer off so exactly one thing rebuilds.
  #
  # Set `schedule: ""` to hand the work back to consumer shard 0. That is the fallback, not the
  # default — a rebuild is a full pass over the keyspace, and running it inside the consumers
  # ties it to a process whose job is to never block.
  # indexMaintenance:
  #   schedule: "17 * * * *"

  # Deleting this resource drains index:systems and index:carriers, which carry no TTL and would
  # otherwise be orphaned. The finalizer stops the rebuild CronJob first — a rebuild racing the
  # purge would restore the whole index rather than merely dirtying it. Set
  # retainIndexesOnDelete: true to keep them — e.g. when replacing the resource in place rather
  # than retiring the feed.
