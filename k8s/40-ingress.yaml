apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elite
  annotations:
    # Staging issued successfully on 2026-07-30, proving the HTTP-01 path; switched to production.
    # If this ever needs re-testing, flip back to letsencrypt-staging and delete the elite-tls
    # secret — production rate limits are unforgiving of a failing challenge loop.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # /api/stream is Server-Sent Events. Without these the proxy buffers the stream and holds
    # frames back, and cuts the connection after its default 60s read timeout — the ticker would
    # look broken while everything behind it worked fine.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  # elite.meancat.com is the only public name. k8s.meancat.com was the side-by-side test hostname
  # and was removed on 2026-07-30 with the droplet: it existed so the cluster could be reached
  # while the public name still pointed at the old stack, and there is no old stack any more.
  tls:
    - hosts:
        - elite.meancat.com
      secretName: elite-tls
  rules:
    - host: elite.meancat.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
