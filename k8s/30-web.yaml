# The web tier. Stateless by construction — static SSR, no circuit, no POSTs, no in-process cache
# that matters — so replicas are interchangeable and the ingress needs no session affinity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # See the note in 20-ingestion.yaml: DOKS names this after the registry.
      imagePullSecrets:
        - name: meancat
      securityContext:
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          # Spread across nodes when there is room, but don't block scheduling on a two-node
          # cluster that is briefly down to one.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: web
      containers:
        - name: web
          image: registry.digitalocean.com/meancat/elite-web:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Redis
              value: redis:6379,abortConnect=false
            - name: REDIS_AUTH_FILE
              value: /etc/redis-auth/password
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          # Readiness is Redis-only. The EDDN stream check is reported on /health for the uptime
          # monitor but is not in the "ready" set: a silent firehose must not empty this Service
          # while the pods are still serving 30-day data perfectly well.
          #
          # timeoutSeconds is set explicitly: the default is 1s, which a readiness check that
          # reaches Redis can blow through the moment the server is briefly busy with someone
          # else's slow command. Still well under periodSeconds so a probe can't overlap itself.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # 384Mi, and don't lower it again without also lowering the GC's heap limit explicitly.
          #
          # The limit is an *input* to the .NET GC, not just a ceiling on it. The image ships
          # System.GC.Server=true (the ASP.NET Core SDK default), and in a container .NET sets its
          # GC heap hard limit to 75% of the cgroup limit. So the limit buys two different things
          # out of one number: how much heap the GC will keep, and how much room everything that
          # *isn't* the GC heap gets on top of it.
          #
          # This was tried at 256Mi (2026-08-11) to reclaim limit commitment on a cluster whose
          # per-node limits are committed past allocatable. It held for about a day and then both
          # pods began OOMKilling on a ~12-18h cycle. 256Mi puts the heap hard limit at 192MiB,
          # but non-heap — native, JIT, thread stacks, loader — is a fairly fixed ~43MiB here and
          # does not shrink with it. That left ~16MiB of slack: the cgroup sat pinned at the limit
          # (anon 224MiB of 256MiB, memory.events "max" climbing as it reclaimed page cache) until
          # an allocation burst it couldn't satisfy. The GC was honouring its limit the whole time
          # and never saw a problem, which is why this looks like a healthy process being killed.
          #
          # At 384Mi the heap limit is 288MiB and the pods sit flat at 308-336MiB with room to
          # spare; no pod was ever OOMKilled at this setting. If the commitment number needs to
          # come down again, the lever is DOTNET_GCHeapHardLimitPercent (or Workstation GC), set
          # so heap + ~50MiB of non-heap fits under the new limit — not the limit on its own.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
      volumes:
        - name: redis-auth
          secret:
            secretName: redis-auth
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
