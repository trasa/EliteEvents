# The web tier. Stateless by construction — static SSR, no circuit, no POSTs, no in-process cache
# that matters — so replicas are interchangeable and the ingress needs no session affinity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # See the note in 20-ingestion.yaml: DOKS names this after the registry.
      imagePullSecrets:
        - name: meancat
      securityContext:
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          # Spread across nodes when there is room, but don't block scheduling on a two-node
          # cluster that is briefly down to one.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: web
      containers:
        - name: web
          image: registry.digitalocean.com/meancat/elite-web:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Redis
              value: redis:6379,abortConnect=false
            - name: REDIS_AUTH_FILE
              value: /etc/redis-auth/password
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          # Readiness is Redis-only. The EDDN stream check is reported on /health for the uptime
          # monitor but is not in the "ready" set: a silent firehose must not empty this Service
          # while the pods are still serving 30-day data perfectly well.
          #
          # timeoutSeconds is set explicitly: the default is 1s, which a readiness check that
          # reaches Redis can blow through the moment the server is briefly busy with someone
          # else's slow command. Still well under periodSeconds so a probe can't overlap itself.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # The memory limit is an *input* to the .NET GC, not just a ceiling on it. The image
          # ships System.GC.Server=true (the ASP.NET Core SDK default), and in a container .NET
          # sets its GC heap hard limit to 75% of the cgroup limit — so a 384Mi limit told the GC
          # it could grow to 288MiB, and it did: both pods sat at 308-336MiB indefinitely on a
          # site with essentially no traffic. That was never a leak. Memory was flat over
          # observation, no pod has ever been OOMKilled, and the ingestion container runs at 68MiB
          # off the same image base and the same 384Mi limit purely because it allocates less.
          #
          # 256Mi puts the heap hard limit at 192MiB and the pods around 210MiB, which reclaims
          # roughly 260MiB of limit commitment across the two replicas. That matters because
          # per-node limits are committed well past allocatable (108-197% at the time of writing);
          # requests are the healthy number, but the margin is thinner than "no MemoryPressure"
          # suggests, and these were the two largest contributors.
          #
          # The failure mode if this is too low is an OOMKill, so it is the number to raise first
          # if the site ever gets real traffic. Watch for restartCount climbing with
          # lastState.terminated.reason=OOMKilled.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
      volumes:
        - name: redis-auth
          secret:
            secretName: redis-auth
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
