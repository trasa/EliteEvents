# The web tier. Stateless by construction — static SSR, no circuit, no POSTs, no in-process cache
# that matters — so replicas are interchangeable and the ingress needs no session affinity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # See the note in 20-ingestion.yaml: DOKS names this after the registry.
      imagePullSecrets:
        - name: meancat
      securityContext:
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          # Spread across nodes when there is room, but don't block scheduling on a two-node
          # cluster that is briefly down to one.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: web
      containers:
        - name: web
          image: registry.digitalocean.com/meancat/elite-web:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Redis
              value: redis:6379,abortConnect=false
            - name: REDIS_AUTH_FILE
              value: /etc/redis-auth/password
            # 0x32 is 50, and the hex matters: every DOTNET_GC* environment variable is parsed
            # as hexadecimal, so a bare "50" would mean 0x50 = 80 percent — worse than the 75
            # percent default this is here to reduce. The "0x" prefix is accepted and is kept for
            # exactly that reason. Nothing validates this value; a typo just silently resizes the
            # heap, so it is checked against measured RSS after any change (see the resources
            # comment below for the expected numbers).
            - name: DOTNET_GCHeapHardLimitPercent
              value: "0x32"
            # How long Redis must be *continuously* unreachable before this pod is treated as
            # unrecoverable and restarted. Set explicitly rather than left to the code default so
            # it can be widened — or zeroed, which disables the watchdog — with an edit and a
            # rollout, no image rebuild, at whatever hour the next incident happens.
            - name: RedisLiveness__UnreachableRestartThreshold
              value: "00:15:00"
          # Liveness is no longer check-free. It used to answer unconditionally, on the reasoning
          # that a process replying at all is worth keeping; on 2026-08-14 a wedged Redis client
          # left both pods Running with 0 restarts and permanently NotReady, which emptied the
          # Service and served 503s for hours. A probe that can never fail cannot restart
          # anything, so an unrecoverable pod just sat there.
          #
          # What it runs now is a watchdog over sustained unreachability, not a Redis call — see
          # RedisConnectivityState. Total time to restart is the threshold above plus
          # periodSeconds x failureThreshold (150s), so ~17.5 min of continuous failure. Both
          # halves are deliberately generous: everything faster than this is a pod that is merely
          # retrying, and restarting those was the risk that kept liveness check-free.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          # Readiness is Redis-only. The EDDN stream check is reported on /health for the uptime
          # monitor but is not in the "ready" set: a silent firehose must not empty this Service
          # while the pods are still serving 30-day data perfectly well.
          #
          # timeoutSeconds is set explicitly: the default is 1s, which a readiness check that
          # reaches Redis can blow through the moment the server is briefly busy with someone
          # else's slow command. Still well under periodSeconds so a probe can't overlap itself.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # This limit and DOTNET_GCHeapHardLimitPercent above are one setting in two places.
          # Change either alone and you get the failure below.
          #
          # The limit is an *input* to the .NET GC, not just a ceiling on it. The image ships
          # System.GC.Server=true (the ASP.NET Core SDK default), and in a container .NET takes
          # 75% of the cgroup limit as its GC heap hard limit unless told otherwise — then grows
          # to fill it. So one number was buying two things: the heap budget, and the room left
          # over for everything that *isn't* the GC heap.
          #
          # Splitting them is what makes a smaller limit safe. History, measured on this app:
          #
          #   384Mi, default 75%  -> 288MiB heap, RSS 308-336MiB. Never OOMKilled, but the
          #                          largest single contributor to limit commitment on a cluster
          #                          whose per-node limits run 108-197% of allocatable.
          #   256Mi, default 75%  -> 192MiB heap, RSS pinned at the 256MiB ceiling (anon 224MiB,
          #                          memory.events "max" climbing as it reclaimed page cache).
          #                          Both pods OOMKilled on a ~12-18h cycle. The heap budget was
          #                          never the problem: non-heap (native, JIT, thread stacks,
          #                          loader) is a fairly fixed ~43MiB and does not scale down
          #                          with it, so this left ~16MiB of slack for any burst. The GC
          #                          stayed inside its own limit throughout, which is why the
          #                          process looked healthy right up to the kill.
          #   256Mi, explicit 50% -> 128MiB heap, expected RSS ~175MiB. ~80MiB of slack, ~5x the
          #                          margin that failed, at the same commitment as the setting
          #                          that OOMKilled. Current setting, as of 2026-08-13.
          #
          # Verifying it took effect is a memory reading, not a config check: RSS settling near
          # 175MiB means the percent parsed as intended; RSS drifting back toward the ceiling
          # means it didn't, and the value is wrong rather than the sizing. Raise the percent
          # before the limit if real traffic ever needs more heap — the limit needs to keep its
          # non-heap headroom either way.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
      volumes:
        - name: redis-auth
          secret:
            secretName: redis-auth
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
