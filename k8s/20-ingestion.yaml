# The single EDDN writer. replicas: 1 and strategy: Recreate together guarantee that a rollout
# never has two of these running at once — two subscribers would double-count every docking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      # DOKS's registry integration names this secret after the registry itself and syncs a copy
      # into every namespace; it is not called registry-<name>.
      imagePullSecrets:
        - name: meancat
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingestion
          image: registry.digitalocean.com/meancat/elite-ingestion:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Redis
              value: redis:6379,abortConnect=false
            - name: REDIS_AUTH_FILE
              value: /etc/redis-auth/password
            # Kept in step with the FeedListener's spec.redisUnreachableRestartAfter, which is
            # what writes this key in the deployed path. This file is the rollback target, so a
            # rollback that silently dropped the watchdog would restore the outage along with the
            # Deployment.
            - name: RedisLiveness__UnreachableRestartThreshold
              value: "00:15:00"
          # Liveness runs one check: Redis unreachable for the threshold above. A quiet EDDN
          # period still must not get the single writer restarted while it is already retrying —
          # that is readiness' job to report — and neither must a consumer that is merely
          # reconnecting. What it catches is a Redis client that has stopped working for good,
          # which no amount of waiting resolves and which otherwise just stops writing forever.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          # timeoutSeconds is set explicitly: the default is 1s, and a readiness check that
          # reaches Redis over a shared multiplexer can blow that budget whenever the
          # single-threaded server is busy with someone else's slow command. Kept in step with
          # the FeedListener controller's probeTimeoutSeconds, since this file is the rollback
          # target for exactly that Deployment.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
      volumes:
        - name: redis-auth
          secret:
            secretName: redis-auth
