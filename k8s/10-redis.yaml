# In-cluster Redis: one replica, one small volume. Every key the apps write is TTL'd and
# disposable, so this is deliberately not a managed database — losing it costs one refill from the
# EDDN firehose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    dir /data

    # Snapshot occasionally so a pod restart doesn't start from nothing. No AOF: durability here
    # is a nicety, not a requirement.
    save 900 1
    save 300 10
    appendonly no

    # Evicting under pressure is the correct behaviour for this data set and beats the pod being
    # OOM-killed. Raise this together with the container memory limit if the working set grows.
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    # Cap what a single client reply may buffer. Redis counts output buffers against maxmemory,
    # so with the default of "normal 0 0 0" — unlimited — one query returning a large collection
    # is enough to push the instance past maxmemory and start evicting real data. That is exactly
    # what happened: a full-range fetch of systems:visits (~20 MB per reply, polled every 15s per
    # open browser tab) drove used_memory_peak to 704 MB and produced 31k allkeys-lru evictions.
    #
    # The query itself is fixed; this is the backstop, so the next unbounded read degrades into
    # one disconnected client instead of a keyspace-wide eviction storm. The soft limit tolerates
    # a briefly slow reader; the hard limit is what a runaway reply hits.
    client-output-buffer-limit normal 64mb 32mb 60
---
# Governing service for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# What the apps connect to.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # Appends requirepass to the config at startup instead of baking the password into the
        # ConfigMap or into argv, where `ps` inside the container would show it.
        - name: render-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cat /config/redis.conf > /etc/redis/redis.conf
              printf 'requirepass %s\n' "$(cat /secret/password)" >> /etc/redis/redis.conf
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: rendered-config
              mountPath: /etc/redis
      containers:
        - name: redis
          image: redis:8.2-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            # redis-cli picks this up automatically, which keeps the password out of the probe
            # command lines below.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          # These are exec probes, so each one pays a shell plus a redis-cli startup and connect
          # before it even sends PING — and PING itself queues behind whatever the single-threaded
          # server is already doing. The 1s default left no margin for that: Redis stalling on one
          # slow command from an application pod could take Redis itself out of its own Service.
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rendered-config
              mountPath: /etc/redis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: secret
          secret:
            secretName: redis-auth
        - name: rendered-config
          emptyDir:
            medium: Memory
  # Everything below the storage request is here to keep `kubectl apply` honest, not because the
  # cluster needs it.
  #
  # volumeClaimTemplates is an *atomic* list in a strategic-merge patch — kubectl replaces the
  # whole list unless the manifest deep-equals the stored copy. The API server defaults
  # apiVersion, kind, spec.volumeMode and status.phase, so a manifest that omits them never
  # matches, and every single apply reported "statefulset.apps/redis configured" against an
  # object that had not changed since it was created. That made the apply summary useless for
  # spotting real drift, which is the only reason to read it.
  #
  # Spelling the defaults out makes apply report "unchanged". `status` in a manifest is admittedly
  # odd — it is inert here because this is a *template*, not a live PVC, and the API server
  # neither reads nor updates it — but it is genuinely required: with the other three present and
  # this block absent, apply still reported "configured".
  #
  # None of this can mutate anything. volumeClaimTemplates is immutable after creation, and the
  # StatefulSet stayed at generation 1 with redis-0 unrestarted across the applies that proved it.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        volumeMode: Filesystem
        resources:
          requests:
            storage: 5Gi
      status:
        phase: Pending
