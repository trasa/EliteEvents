apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elite

resources:
  - 00-namespace.yaml
  - 10-redis.yaml
  - 25-feedlistener.yaml
  - 30-web.yaml
  - 40-ingress.yaml
  - 45-redirect-ingress.yaml
  # cluster-issuer.yaml is deliberately not here: ClusterIssuers are cluster-scoped, and kustomize
  # would stamp `namespace: elite` onto them because it can't know that about a CRD. They are
  # one-time cluster bootstrap, applied alongside cert-manager itself.

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: elite-events

# These tags are what is deployed. `./deploy-k8s <tag>` rewrites them and then applies, so this
# file is the record of the running version — commit it after a deploy.
#
# It used to say `latest`, with the real version pinned afterwards by `kubectl set image`. That
# made any bare `kubectl apply -k k8s/` reset both Deployments to `:latest` and roll production,
# which bit us on 2026-07-30. Now a clean checkout applies to exactly what is running, so a bare
# apply is a no-op — but it also means an edit here is a real deploy instruction, not a default.
images:
  - name: registry.digitalocean.com/meancat/elite-web
    newTag: 1.0.0-alpha.gc430b0de1c
  - name: registry.digitalocean.com/meancat/elite-ingestion
    newTag: 1.0.0-alpha.gc430b0de1c

# The redis-auth Secret is deliberately absent: it is created once, out of band, and never
# committed. See k8s/README.md.
