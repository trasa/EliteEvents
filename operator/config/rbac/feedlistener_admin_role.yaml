# This rule is not used by the project elite-events-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over elite.meancat.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elite-events-operator
    app.kubernetes.io/managed-by: kustomize
  name: feedlistener-admin-role
rules:
- apiGroups:
  - elite.meancat.com
  resources:
  - feedlisteners
  verbs:
  - '*'
- apiGroups:
  - elite.meancat.com
  resources:
  - feedlisteners/status
  verbs:
  - get
