# This rule is not used by the project elite-events-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to elite.meancat.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elite-events-operator
    app.kubernetes.io/managed-by: kustomize
  name: feedlistener-viewer-role
rules:
- apiGroups:
  - elite.meancat.com
  resources:
  - feedlisteners
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - elite.meancat.com
  resources:
  - feedlisteners/status
  verbs:
  - get
