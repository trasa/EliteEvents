name: Build and Push Images

on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for nbgv versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        run: |
          dotnet tool restore
          echo "version=$(dotnet nbgv get-version -v NuGetPackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean container registry
        run: doctl registry login --expiry-seconds 1800

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push elite-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            registry.digitalocean.com/meancat/elite-web:${{ steps.version.outputs.version }}
            registry.digitalocean.com/meancat/elite-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push elite-ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ingestion
          platforms: linux/amd64
          push: true
          tags: |
            registry.digitalocean.com/meancat/elite-ingestion:${{ steps.version.outputs.version }}
            registry.digitalocean.com/meancat/elite-ingestion:latest
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,mode=max,scope=ingestion

      - name: Summary
        run: echo "Pushed ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
